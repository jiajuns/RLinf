# Phase-2 reproducible control: privileged ManiSkill oracle events + SMDP
# temporal credit.  This is intentionally separate from the later learned
# Event Observer and same-state interventional credit experiment.
defaults:
  # ``maniskill_ppo_openpi_pi05`` is the Hydra primary composition root.
  # Referencing the Flow-SDE convenience config here would make that root a
  # nested default, which Hydra rejects because it declares a searchpath.
  - maniskill_ppo_openpi_pi05
  - _self_

runner:
  logger:
    experiment_name: "maniskill_ppo_openpi_pi05_event_smdp"

algorithm:
  adv_type: event_smdp_temporal
  loss_type: event_actor
  event_value_source: pi05_value_proxy
  # Event credit must operate per executed action, not after chunk reward
  # aggregation, so oracle event durations remain observable.
  reward_type: action_level

actor:
  model:
    openpi:
      noise_method: flow_sde
      noise_level: 0.5
      joint_logprob: false

env:
  train:
    event_oracle:
      enabled: true
      align_distance: 0.08
      transport_distance: 0.20
      grasp_confirmation_steps: 2
